name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix double-folder
        run: |
          echo "Looking for package.json..."
          FOUND=$(find . -name "package.json" -not -path "*/node_modules/*" | head -1)
          echo "Found at $FOUND"
          if [ "$FOUND" != "./package.json" ] && [ -n "$FOUND" ]; then
            DIR=$(dirname "$FOUND")
            echo "Moving from $DIR to root"
            cp -r "$DIR"/* .
            cp -r "$DIR"/.* . 2>/dev/null || true
            rm -rf "$DIR"
            # If DIR was nested like Jaan-nurieee, remove outer too
            if [ -d "Jaan-nurieee" ]; then rm -rf Jaan-nurieee; fi
            if [ -d "Jaan-nurie..." ]; then rm -rf Jaan-nurie...; fi
          fi
          ls -la
          cat package.json
          ls -la www

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm install

      - name: Add Android
        run: npx cap add android

      - name: Copy web
        run: npx cap copy android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JaanNurie-YOUR-EXACT-CODE
          path: android/app/build/outputs/apk/debug/app-debug.apk
